<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview</title>
<!-- Source for public/og-image.png. Render with: npm run og -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Newsreader:opsz,wght@6..72,400&family=Bodoni+Moda:opsz,wght@6..96,500&display=block" rel="stylesheet">
<style>
:root {
  --paper: #fbfaf8; --paper-2: #f2f2ef; --rule: #e2e1dd;
  --ink: #111419; --ink-2: #494d54; --ink-3: #6e7278;
  --metrics: #f5b33b; --metrics-ink: #180f09;
  --serif: 'Newsreader', Georgia, serif; --sans: 'Inter Tight', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
.og { display: grid; grid-template-columns: 520px 1fr; height: 100%; }
.left { display: grid; place-items: center; background: radial-gradient(70% 70% at 50% 45%, rgb(245 179 59 / 0.45), rgb(245 179 59 / 0.12) 70%), var(--paper-2); }
.cv { display: flex; flex-direction: column; width: 300px; height: 430px; padding: 22px 24px; border-radius: 6px 10px 10px 6px; background: var(--metrics); color: var(--metrics-ink); transform: rotate(-5deg); box-shadow: inset 6px 0 0 rgb(0 0 0 / 0.08), 0 30px 60px -20px rgb(60 40 0 / 0.45), 0 4px 10px rgb(60 40 0 / 0.15); }
.cv__band { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1.5px solid currentColor; font: 500 14px/1 var(--sans); }
.cv__big { margin-top: 36px; font: 500 112px/0.9 'Bodoni Moda', var(--serif); letter-spacing: -0.03em; }
.cv__rule { height: 1.5px; margin-top: 18px; background: currentColor; }
.cv__title { margin-top: auto; font: 400 30px/1.05 var(--serif); }
.cv__tag { margin-top: 10px; font-size: 14px; opacity: 0.8; }
.right { display: flex; flex-direction: column; padding: 84px 80px 64px 56px; }
.no { font: 500 20px/1 var(--sans); color: var(--ink-3); }
h1 { margin: 22px 0 0; font: 400 96px/0.98 var(--serif); letter-spacing: -0.035em; }
.sub { margin: 26px 0 0; font: 400 30px/1.3 var(--serif); color: var(--ink-2); }
.specs { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px 32px; margin-top: auto; padding-top: 22px; border-top: 1px solid var(--rule); }
.specs div { font-size: 19px; color: var(--ink-2); }
.specs b { display: block; margin-bottom: 4px; font-weight: 500; font-size: 15px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="og">
  <div class="left">
    <div class="cv">
      <div class="cv__band"><span>Aum Shah</span><span>Est. 2024</span></div>
      <div class="cv__big">AUM</div>
      <div class="cv__rule"></div>
      <div class="cv__title">Asset Under Management</div>
      <div class="cv__tag">Pun intended.</div>
    </div>
  </div>
  <div class="right">
    <div class="no">The collection, editions 001 to 006</div>
    <h1>Aum Shah</h1>
    <p class="sub">Full-stack and AI engineer. Agentic AI in production, cloud services and well-tested Python APIs.</p>
    <div class="specs">
      <div><b>Recognition</b>Employee of the Quarter, Q2 2025</div>
      <div><b>Based in</b>India, open to remote</div>
    </div>
  </div>
</div>
</body>
</html>
