<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="30%" cy="0%" r="90%">
      <stop offset="0" stop-color="#2ee787" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#2ee787" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee787" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2ee787" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#e9f2ec" fill-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#060c09"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ticker tape -->
  <rect width="1200" height="44" fill="#04180e"/>
  <rect y="44" width="1200" height="1" fill="#2ee787" fill-opacity="0.25"/>
  <text x="40" y="28" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="16" fill="#9fd8b6" letter-spacing="1">
    AUM/SHAH <tspan fill="#2ee787">▲ open to offers</tspan>   /   CPLT <tspan fill="#2ee787">▲ 30+ squads</tspan>   /   CLMS <tspan fill="#2ee787">▼ 15d to 3-4d</tspan>   /   NMRA <tspan fill="#2ee787">▲ HTTP + MCP</tspan>
  </text>

  <!-- slate stripe -->
  <g transform="translate(80 118)">
    <rect width="30" height="30" fill="#f2ead8"/>
    <path d="M6 0h7L0 13V6zM20 0h7L0 27v-7zM30 4v7L11 30H4zM30 18v7l-5 5h-7z" fill="#060c09"/>
    <text x="48" y="21" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="17" fill="#2ee787" letter-spacing="5">SC 01 · MARKET OPEN</text>
  </g>

  <!-- wordmark -->
  <text x="76" y="300" font-family="'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-weight="800" font-size="118" fill="#f2ead8" letter-spacing="-3">AUM SHAH</text>
  <text x="80" y="372" font-family="'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-weight="700" font-size="44" fill="#2ee787" letter-spacing="-1">as in Asset Under Management.</text>
  <text x="80" y="428" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="21" fill="#9db8a7" letter-spacing="1">Full-stack &amp; AI engineer · agentic systems · Python APIs</text>

  <!-- sparkline -->
  <g transform="translate(80 470)">
    <path d="M0,86 L90,74 180,78 270,52 360,58 450,32 540,36 630,14 1040,0 L1040,100 L0,100 Z" fill="url(#spark)"/>
    <polyline points="0,86 90,74 180,78 270,52 360,58 450,32 540,36 630,14 1040,0" fill="none" stroke="#2ee787" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- footer strip -->
  <rect y="586" width="1200" height="44" fill="#04120b"/>
  <rect y="586" width="1200" height="1" fill="#2ee787" fill-opacity="0.2"/>
  <text x="80" y="614" font-family="Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#5f8a72" letter-spacing="4">SC01 OPEN   SC02 HOLDINGS   SC03 INTERMISSION   SC04 PLAYER   SC05 REEL   SC06 CREDITS</text>
  <rect x="80" y="584" width="150" height="3" fill="#2ee787"/>

  <rect width="1200" height="630" fill="url(#scan)"/>
